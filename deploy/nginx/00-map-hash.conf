# /etc/nginx/conf.d/00-map-hash.conf — размер хэша для карт (map) с длинными ключами:
# shift-redirects.conf не собирается с размером по умолчанию (64).
# Имя с 00- не случайно: nginx принимает эти директивы только до первого map
# в http {}, а conf.d/*.conf включается по алфавиту. Ставится руками, один раз.
map_hash_bucket_size 128;
map_hash_max_size 4096;
