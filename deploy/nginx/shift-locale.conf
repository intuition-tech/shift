# Запоминание языка: редирект по куке _int_locale (перенос из arutyunov.info,
# там префикс /ru, здесь — /en: русский в корне, английский под /en).
#
# Куку ставит переключатель EN/RU (src/scripts/main.js): ru_RU или en_US, на год.
# Старый сервер (Express) читал её и редиректил на нужный язык; статика сама
# этого не умеет, поэтому правило живёт в nginx. Лежит в /etc/nginx/conf.d/
# (контекст http: map разрешён только там). В server {} shift.dodobrands.io,
# до location-блоков, одна строка:
#
#     if ($locale_redirect) { return 302 $locale_redirect$is_args$args; }
#
# Логика:
#   кука en_US + страница без /en  → 302 на /en + тот же путь
#   кука ru_RU + страница под /en  → 302 на тот же путь без /en
#   нет куки, незнакомое значение, файл с расширением (css, json, картинки) — ничего.
# Без куки сайт отдаёт то, что просят: для ботов и чужих ссылок поведение не меняется.

# Язык из куки. Неизвестное значение — как отсутствие куки.
map $cookie__int_locale $locale_lang {
    default  "";
    ru_RU    ru;
    en_US    en;
}

# Страница это или файл. Страницы — без расширения или .html;
# всё остальное с расширением (site.css, search-index.json, фото, зипы в /cdn/) не трогаем.
map $uri $locale_is_page {
    default                 1;
    "~\.html$"              1;
    "~\.[A-Za-z0-9]+$"      0;
}

# Куда редиректить. Пусто — редирект не нужен.
map "$locale_lang:$locale_is_page:$uri" $locale_redirect {
    default  "";

    # en-кука, путь не под /en → добавить префикс
    "~^en:1:(?<rest>/(?!en(/|$)).*)$"    /en$rest;

    # ru-кука, путь под /en → снять префикс
    "~^ru:1:/en/?$"                      /;
    "~^ru:1:/en(?<rest>/.+)$"            $rest;
}
