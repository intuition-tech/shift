<header>
  <div class="nav">
    <div class="nav-item">
      <a class="logo" href="{{ '/en/' if lang == 'en' else '/' }}">
        <span class="logo-icon">{% include "logo.svg" %}</span>
      </a>
    </div>
    <nav class="nav-item nav-sections">
      {%- set prefix = '/en' if lang == 'en' else '' %}
      {%- if lang == 'ru' %}
      <a href="{{ prefix }}/publications/" data-nav-group="">Все публикации</a>
      <a href="{{ prefix }}/publications/?group=markets" data-nav-group="markets">Рынки</a>
      <a href="{{ prefix }}/publications/?group=teams" data-nav-group="teams">Команды</a>
      <a href="{{ prefix }}/publications/?group=collections" data-nav-group="collections">Подборки</a>
      {%- else %}
      <a href="{{ prefix }}/publications/" data-nav-group="">All publications</a>
      <a href="{{ prefix }}/publications/?group=markets" data-nav-group="markets">Markets</a>
      <a href="{{ prefix }}/publications/?group=teams" data-nav-group="teams">Teams</a>
      <a href="{{ prefix }}/publications/?group=collections" data-nav-group="collections">Collections</a>
      {%- endif %}
    </nav>
    <div class="nav-item">
      {%- if lang == 'ru' %}
      <div class="switcher">
        <a href="{{ otherLangUrl }}" data-locale="en_US">EN</a><span class="ids__rounded">RU</span>
      </div>
      {%- else %}
      <div class="switcher">
        <span class="ids__rounded">EN</span><a href="{{ otherLangUrl }}" data-locale="ru_RU">RU</a>
      </div>
      {%- endif %}
    </div>
  </div>
</header>
